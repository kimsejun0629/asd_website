<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newsroom · Korean Air Aerospace</title>
<meta name="description" content="Korean Air Aerospace news, videos and brochures">
<link rel="alternate" hreflang="ko" href="newsroom.html">
<link rel="stylesheet" href="css/fonts.css?v=refactor-d1"><link rel="stylesheet" href="css/site.css?v=refactor-d1">
<link rel="stylesheet" href="css/newsroom.css?v=refactor-d1">
</head>
<body data-page="newsroom">
<div id="gh"></div>
<main>
  <section class="ph" data-hero-tabs>
    <img src="img/co/KAL_HQ_02.webp" alt="">
    <div class="in">
      <div class="lbl mk">News</div>
      <h1 id="news-title">News</h1>
      <p>Relentless innovation and challenge</p>
    </div>
  </section>

  <section class="sec pat-v" id="news" data-hero-label="News" aria-labelledby="news-title">
    <p class="lang-note">Headlines are translated into English. Linked articles are published in Korean.</p>
    <a class="card feat" id="feat" href="#" target="_blank" rel="noopener"></a>
    <div class="tools">
      <div class="years" id="years" role="group" aria-label="Filter by year"></div>
      <label class="search"><span>Search</span><input type="search" id="q" placeholder="Headline" autocomplete="off"></label>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
    <div class="pager"><button type="button" class="btn b-line" id="moreBtn" style="min-width:240px"><span class="roll"><span>Load more</span><span>Load more</span></span><span class="cnt" id="cnt"></span></button></div>
  </section>

  <section class="sec light pat-v" id="video" data-hero-label="Video" aria-labelledby="news-title">
    <div class="vgrid" id="vgrid"></div>
  </section>

  <section class="sec pat-v" id="brochure" data-hero-label="Brochure" aria-labelledby="news-title">
    <div class="bgrid" id="bgrid"></div>
  </section>
</main>
<div id="gf"></div>
<script src="js/site.js?v=refactor-d1"></script>
<script src="js/newsroom.js?v=refactor-d1"></script>
<script src="js/scroll-fx.js?v=refactor-d1"></script>
</body>
</html>
